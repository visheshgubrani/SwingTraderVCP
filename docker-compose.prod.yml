# Production stack for the ARM VPS.
# Local laptop deps (Postgres/Redis on 5480/6380) stay in docker-compose.dev.yml.
#
# Usage on the VPS:
#   cp .env.prod.example .env.prod   # fill secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Redis runs on the Compose internal network (requirepass, AOF, no host port).
# Enable Swyingify later with: --profile saas

name: swingtradervcp

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-algo_trading}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-algo} -d ${POSTGRES_DB:-algo_trading}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    # Bound to loopback only — host 5482 avoids other stacks on this VPS.
    ports:
      - "127.0.0.1:5482:5432"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:?set REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/visheshgubrani/swingtradervcp}/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      # Discrete parts — app URL-encodes the password. Do not interpolate
      # POSTGRES_PASSWORD into DATABASE_URL (SQLAlchemy breaks on '@' in passwords).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_ENVIRONMENT: production
    networks:
      - internal
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8002}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/visheshgubrani/swingtradervcp}/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "run_worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_ENVIRONMENT: production
    networks:
      - internal
    # Image HEALTHCHECK probes /health (API-only). Disable for the worker.
    healthcheck:
      test: ["CMD", "python", "-c", "raise SystemExit(0)"]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 10s

  proposal-worker:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/visheshgubrani/swingtradervcp}/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "app.workers.proposal_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_ENVIRONMENT: production
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "raise SystemExit(0)"]

  tick-worker:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/visheshgubrani/swingtradervcp}/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "app.workers.tick_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_ENVIRONMENT: production
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "raise SystemExit(0)"]

  entry-supervisor:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/visheshgubrani/swingtradervcp}/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "app.workers.entry_supervisor"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_ENVIRONMENT: production
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "raise SystemExit(0)"]

  position-monitor:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/visheshgubrani/swingtradervcp}/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "app.workers.position_monitor"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_ENVIRONMENT: production
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "raise SystemExit(0)"]

  order-gateway:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/visheshgubrani/swingtradervcp}/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "app.workers.order_gateway"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_ENVIRONMENT: production
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "raise SystemExit(0)"]

  client:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/visheshgubrani/swingtradervcp}/client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "127.0.0.1:${CLIENT_HOST_PORT:-8090}:80"

  swyingify:
    profiles: ["saas"]
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/visheshgubrani/swingtradervcp}/swyingify:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      API_URL: http://api:8000
    networks:
      - internal
    ports:
      - "127.0.0.1:${SWYINGIFY_HOST_PORT:-3002}:3000"

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
